name: Chinese product validation
on:
  push:
    branches: [main, dev, zh-stable, 'feat/zh-cn', 'hotfix/**', 'release/**']
    tags: ['*-zh.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node scripts/check-zh-cn.mjs
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      # The current lockfile needs this DOM peer for frontend tests.
      - run: npm install --no-save --package-lock=false --legacy-peer-deps @testing-library/dom@10.4.1
        working-directory: frontend
      - run: node scripts/check-locale-usage.mjs
      - run: node --test scripts/check-zh-cn.test.mjs
      - run: npm run build:check
        working-directory: frontend
        env:
          VITE_DEFAULT_LANGUAGE: zh-CN
      - run: npm test
        working-directory: frontend
