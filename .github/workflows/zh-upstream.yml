name: Watch upstream stable
on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  upstream:
    if: github.repository != 'PicPeak/picpeak'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check stable baseline and translation drift
        id: check
        run: |
          git remote add upstream https://github.com/PicPeak/picpeak.git || true
          git fetch upstream stable
          incoming=$(git rev-parse upstream/stable)
          current=$(cat .picpeak-upstream-sha)
          echo "sha=$incoming" >> "$GITHUB_OUTPUT"
          if [ "$incoming" != "$current" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git show upstream/stable:frontend/src/i18n/locales/en.json > /tmp/upstream-en.json
            node scripts/check-zh-cn.mjs /tmp/upstream-en.json frontend/src/i18n/locales/zh-CN.json > /tmp/parity.txt 2>&1 || true
            bash scripts/sync-upstream-zh.sh --plan --all > /tmp/merge-plan-all.txt
            bash scripts/sync-upstream-zh.sh --plan --exclude-retired > /tmp/merge-plan-excluded.txt
          fi
      - name: Open one review issue per upstream SHA
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          INCOMING_SHA: ${{ steps.check.outputs.sha }}
        run: |
          title="同步 upstream stable $INCOMING_SHA"
          existing=$(gh issue list --repo "$REPOSITORY" --state all --search "$INCOMING_SHA in:title" --json number --jq 'length')
          if [ "$existing" = 0 ]; then
            {
              echo '发现新的官方 stable 提交。请按 docs/zh-CN-maintenance.md 合并、补翻译、验证真实容器后发布锁定版本。'
              echo
              echo '选择一：完整同步官方代码（可能恢复已删除模块）'
              echo '```'
              cat /tmp/merge-plan-all.txt
              echo '```'
              echo
              echo '选择二：剔除已删除模块后同步其余官方改动'
              echo '```'
              cat /tmp/merge-plan-excluded.txt
              echo '```'
              echo
              echo '中文键和占位符差异：'
              echo '```'
              cat /tmp/parity.txt
              echo '```'
            } > /tmp/issue.md
            gh issue create --repo "$REPOSITORY" --title "$title" --body-file /tmp/issue.md
          fi
